<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard & Exam Paper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d0c1d; }
        /* Custom darker gradient for background */
        .card-bg { background: linear-gradient(135deg, #1f1d36 0%, #0d0c1d 100%); }
        /* Style for required input fields */
        .answer-input:focus { border-color: #6366f1; }
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen text-gray-100">

    <div id="dashboard-view" class="max-w-4xl mx-auto">
        <h1 class="text-3xl sm:text-4xl font-bold mb-8 text-indigo-400">Student Dashboard</h1>
        
        <!-- Subject Input -->
        <input type="text" value="mathematics" readonly class="w-full p-3 mb-8 bg-gray-800 border border-indigo-600 rounded-lg text-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <!-- Available Papers Section -->
        <div class="mb-12">
            <h2 class="text-2xl font-semibold mb-4 flex items-center">
                <svg class="w-6 h-6 mr-3 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Available Papers
            </h2>

            <!-- Paper Card -->
            <div id="paper-card" class="card-bg p-6 rounded-xl shadow-2xl border border-indigo-700/50">
                <h3 class="text-xl font-bold text-indigo-300">Mathematics</h3>
                <p class="text-md text-gray-400 mb-4">Mathematics</p>
                
                <div class="flex flex-wrap items-center space-x-4 mb-6 text-sm">
                    <span class="flex items-center text-gray-400">
                        <svg class="w-4 h-4 mr-1 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        60 min
                    </span>
                    <span class="flex items-center text-gray-400">
                        <svg class="w-4 h-4 mr-1 text-yellow-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.62-.921 1.92 0l1.242 3.824a1 1 0 00.95.691h4.037c.969 0 1.371 1.24.588 1.81l-3.27 2.376a1 1 0 00-.364 1.118l1.242 3.824c.3.921-.755 1.688-1.54 1.118l-3.27-2.376a1 1 0 00-1.176 0l-3.27 2.376c-.784.57-1.839-.197-1.54-1.118l1.242-3.824a1 1 0 00-.364-1.118L2.012 9.252c-.783-.57-.381-1.81.588-1.81h4.037a1 1 0 00.95-.691l1.242-3.824z"></path></svg>
                        39 marks
                    </span>
                    <span class="bg-yellow-600/30 text-yellow-300 text-xs font-medium px-2.5 py-0.5 rounded-full">Medium</span>
                </div>

                <!-- View Paper Button -->
                <button id="view-paper-btn" onclick="viewPaper()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    View Paper
                </button>
            </div>
        </div>
    </div>

    <!-- Paper View Section (Student Submission View) -->
    <div id="paper-view" class="hidden max-w-4xl mx-auto mt-10">
        <h2 class="text-3xl font-bold mb-6 text-indigo-400 border-b border-indigo-700 pb-2">Attempting Mathematics Examination Paper</h2>
        <div id="questions-container">
            <!-- Questions and input fields will be rendered here -->
            <p class="text-gray-400">Click View Paper to load questions...</p>
        </div>
        
        <div class="flex justify-between mt-8">
            <button onclick="hidePaper()" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-6 rounded-xl transition duration-200 shadow-md">
                Back to Dashboard
            </button>
            <button onclick="submitPaper()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-8 rounded-xl transition duration-200 shadow-xl">
                Submit Paper
            </button>
        </div>
    </div>

    <script>
        // --- Simulated Data from ai_services.py ---
        // NOTE: In your production app, this data must be fetched from your server (e.g., using the /api/get_paper endpoint).
        const generatedQuestions = {
            "questions": [
                {
                    "type": "one_word_answer",
                    "question": "What is the result of 5 multiplied by 8?",
                    "model_answer": "Forty", 
                    "marks": 1,
                    "q_id": 1
                },
                {
                    "type": "one_word_answer",
                    "question": "What shape has four equal sides and four right angles?",
                    "model_answer": "Square", 
                    "marks": 1,
                    "q_id": 2
                },
                {
                    "type": "short_answer",
                    "question": "Explain the concept of prime numbers and provide two examples.",
                    "model_answer": "A prime number is a natural number greater than 1 that has no positive divisors other than 1 and itself. Examples include 2, 3, 5, 7, 11.", 
                    "marks": 5,
                    "q_id": 3
                },
                {
                    "type": "essay",
                    "question": "Discuss the historical significance of the discovery of Pi ($\\pi$) and its applications in modern engineering.",
                    "marks": 10,
                    "q_id": 4
                }
            ]
        };

        // --- Core Functions ---

        /**
         * Renders the questions and appropriate input fields for the student to answer.
         */
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            let questionNumber = 1;

            generatedQuestions.questions.forEach(q => {
                const qElement = document.createElement('div');
                qElement.className = 'card-bg p-5 rounded-xl mb-6 shadow-xl border border-gray-700';

                // Base content for the question
                let content = `
                    <p class="text-lg font-semibold text-indigo-200 mb-2">Q${questionNumber}. (${q.marks} marks)</p>
                    <p class="text-white mb-3">${q.question}</p>
                `;

                // Add appropriate input field for the student
                if (q.type === 'one_word_answer') {
                    content += `
                        <p class="text-sm text-gray-400 mb-1">Answer Type: Single Word</p>
                        <input type="text" data-q-id="${q.q_id}" 
                               class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 answer-input" 
                               placeholder="Enter your single-word answer here..." />
                    `;
                } else if (q.type === 'short_answer') {
                    content += `
                        <p class="text-sm text-gray-400 mb-1">Answer Type: Short Answer</p>
                        <textarea rows="4" data-q-id="${q.q_id}"
                                  class="w-full p-3 mt-1 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 answer-input" 
                                  placeholder="Write your short answer here..."></textarea>
                    `;
                } else if (q.type === 'essay') {
                    content += `
                        <p class="text-sm text-gray-400 mb-1">Answer Type: Essay</p>
                        <textarea rows="8" data-q-id="${q.q_id}"
                                  class="w-full p-3 mt-1 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 answer-input" 
                                  placeholder="Write your detailed essay answer here..."></textarea>
                    `;
                }

                qElement.innerHTML = content;
                container.appendChild(qElement);
                questionNumber++;
            });
        }

        /**
         * Shows the paper view (submission mode) and hides the dashboard.
         */
        function viewPaper() {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('paper-view').classList.remove('hidden');
            renderQuestions();
        }

        /**
         * Hides the paper view and shows the dashboard.
         */
        function hidePaper() {
            document.getElementById('paper-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
        }

        /**
         * Collects student answers and simulates sending them for grading.
         */
        function submitPaper() {
            const answerInputs = document.querySelectorAll('.answer-input');
            const studentAnswers = [];
            
            // 1. Collect answers
            answerInputs.forEach(input => {
                const questionId = input.getAttribute('data-q-id');
                const answer = input.value.trim();

                // Store all answers, even blank ones, to match question sequence.
                // In a real API call, only non-empty answers might be sent.
                studentAnswers.push({
                    q_id: parseInt(questionId),
                    answer: answer
                });
            });

            // 2. Prepare payload (questions + answers)
            const submissionPayload = {
                questions: generatedQuestions.questions,
                answers: studentAnswers
            };

            // 3. Simulate POST request to the grading endpoint (e.g., /api/grade_submission)
            console.log("Submission Payload:", submissionPayload);
            
            // NOTE: Replace this alert/console.log with your actual fetch request to your server's /api/grade_submission endpoint.
            alert(`Paper submission initiated. ${studentAnswers.length} answers collected (some may be empty).`);
            
            // Return to dashboard after submission (or show a loading screen)
            hidePaper();
        }

    </script>
</body>
</html>
